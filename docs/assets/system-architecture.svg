<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Concursus system architecture</title>
  <desc id="desc">A compact architecture diagram. Core, Assemble, Build, and Execute form the static spine; State is durable storage; Reasoning is pre-compile; Governor controls complete episodes; Transfer exports finished state.</desc>
  <defs>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#172033}.subtitle{font:15px Arial,sans-serif;fill:#4b5563}.name{font:700 22px Arial,sans-serif;fill:#172033}.role{font:15px Arial,sans-serif;fill:#263449}.note{font:13px Arial,sans-serif;fill:#4b5563}.band{fill:#f8fafc;stroke:#cbd5e1;stroke-width:2}.core{fill:#e7f0ff;stroke:#2563eb;stroke-width:2}.runtime{fill:#e9f9ee;stroke:#16a34a;stroke-width:2}.state{fill:#fff5dc;stroke:#d97706;stroke-width:2}.optional{fill:#f4eaff;stroke:#7c3aed;stroke-width:2}.external{fill:#fce9ee;stroke:#db2777;stroke-width:2}.arrow{fill:none;stroke:#334155;stroke-width:3;marker-end:url(#head)}.statearrow{fill:none;stroke:#b45309;stroke-width:3;marker-end:url(#statehead)}.optarrow{fill:none;stroke:#7c3aed;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#opthead)}
    </style>
    <marker id="head" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#334155"/></marker>
    <marker id="statehead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#b45309"/></marker>
    <marker id="opthead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#7c3aed"/></marker>
  </defs>
  <rect width="1600" height="900" fill="white"/>
  <text x="60" y="55" class="title">Concursus architecture</text>
  <text x="60" y="82" class="subtitle">The static compiler/runtime spine is immutable per episode. Purple paths are opt-in and stay outside a running supervisor.</text>

  <rect x="55" y="125" width="1490" height="230" rx="18" class="band"/>
  <text x="80" y="158" class="note">OPTIONAL PLAN FORMATION AND OUTER CONTROL</text>
  <rect x="150" y="190" width="270" height="105" rx="14" class="optional"/>
  <text x="180" y="228" class="name">CLI</text><text x="180" y="257" class="role">Validate · plan · deploy · run</text>
  <rect x="590" y="190" width="300" height="105" rx="14" class="optional"/>
  <text x="620" y="228" class="name">Reasoning</text><text x="620" y="257" class="role">Deliberate and form a DAG</text>
  <rect x="1060" y="190" width="330" height="105" rx="14" class="optional"/>
  <text x="1090" y="228" class="name">Governor</text><text x="1090" y="257" class="role">Route complete bounded episodes</text>

  <rect x="55" y="390" width="1490" height="210" rx="18" class="band"/>
  <text x="80" y="423" class="note">STATIC COMPILER + RUNTIME SPINE</text>
  <rect x="95" y="455" width="225" height="95" rx="14" class="core"/>
  <text x="120" y="491" class="name">Core</text><text x="120" y="520" class="role">Declare DAG and contracts</text>
  <rect x="385" y="455" width="225" height="95" rx="14" class="core"/>
  <text x="410" y="491" class="name">Assemble</text><text x="410" y="520" class="role">Resolve and freeze plan</text>
  <rect x="675" y="455" width="225" height="95" rx="14" class="runtime"/>
  <text x="700" y="491" class="name">Build</text><text x="700" y="520" class="role">Package and provision</text>
  <rect x="965" y="455" width="225" height="95" rx="14" class="runtime"/>
  <text x="990" y="491" class="name">Execute</text><text x="990" y="520" class="role">Dispatch frozen plan</text>
  <rect x="1255" y="455" width="225" height="95" rx="14" class="external"/>
  <text x="1280" y="491" class="name">AgentCore</text><text x="1280" y="520" class="role">Runtimes and Memory</text>
  <path d="M320 502 H385" class="arrow"/><path d="M610 502 H675" class="arrow"/><path d="M900 502 H965" class="arrow"/><path d="M1190 502 H1255" class="arrow"/>

  <rect x="965" y="680" width="300" height="105" rx="14" class="state"/>
  <text x="990" y="718" class="name">State</text><text x="990" y="747" class="role">Append, replay, project</text>
  <rect x="585" y="680" width="300" height="105" rx="14" class="state"/>
  <text x="610" y="718" class="name">Transfer</text><text x="610" y="747" class="role">Export finished run notes</text>
  <rect x="205" y="680" width="300" height="105" rx="14" class="external"/>
  <text x="230" y="718" class="name">Slipbox</text><text x="230" y="747" class="role">Permanent knowledge store</text>
  <path d="M1077 550 V680" class="statearrow"/><path d="M965 733 H885" class="statearrow"/><path d="M585 733 H505" class="statearrow"/>
  <text x="1090" y="632" class="note">validated records / replay</text>

  <path d="M285 295 V455" class="optarrow"/>
  <path d="M740 295 V455" class="optarrow"/>
  <path d="M1225 295 V415 H1078 V455" class="optarrow"/>
  <text x="225" y="375" class="note">drives</text><text x="755" y="375" class="note">DAG</text><text x="1120" y="375" class="note">fresh episode</text>
  <text x="60" y="850" class="note">Invariant: AgentDAG → Assemble → immutable ProvisioningPlan → Execute. Reasoning is before assembly; Governor and Transfer run between episodes.</text>
</svg>
